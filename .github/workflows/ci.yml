name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check clang-format
        run: |
          uv sync --locked --only-group dev --no-install-project
          git ls-files '*.h' '*.hpp' '*.cpp' | xargs --no-run-if-empty uv run --no-sync clang-format --dry-run --Werror

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        preset: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Create the virtual environment
        run: uv sync --locked
      - name: Cache the oneMKL wheels
        if: runner.os != 'macOS'
        uses: actions/cache@v4
        with:
          path: build/_cache
          key: ${{ runner.os }}-onemkl-2026.1.0
      - name: Configure, build, and test (GoogleTest and pytest)
        run: cmake --workflow --preset ${{ matrix.preset }}
      - name: Verify the Windows PARDISO backend is enabled
        if: runner.os == 'Windows'
        run: uv run --no-sync python -c "from litepgo.linalg.sparse_solver import AutoSparseSolver, PardisoLLT; assert AutoSparseSolver is PardisoLLT"
