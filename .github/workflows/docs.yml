name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOCS_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: none
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install locked Python, documentation, and tutorial dependencies
        run: uv sync --locked --group docs
      - name: Cache native dependency downloads
        uses: actions/cache@v4
        with:
          path: build/_cache
          key: Linux-onemkl-2026.1.0
      - name: Build and register the Python API
        run: |
          cmake --preset release-all -DLITEPGO_BUILD_TESTS=OFF
          cmake --build build/release-all --target litepgo_python --parallel 2
      - name: Test notebook execution and export infrastructure
        run: uv run --locked --group docs python -m pytest -q tests/python/test_torch_tutorials.py tests/python/test_energy_tutorials.py
      - name: Build the C++20 tutorial kernel
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: uv run scripts/setup_cpp_tutorial.py --no-register
      - name: Execute the tutorials and build manual and API references
        run: uv run docs/scripts/site.py build
      - name: Check Markdown rendering and generated API entry points
        run: |
          uv run --locked --group docs --directory docs corepack pnpm exec node --test .vitepress/mermaid.test.mjs
          test -f docs/.vitepress/dist/index.html
          test -f docs/.vitepress/dist/reference/cpp/index.html
          test -f docs/.vitepress/dist/reference/python/index.html
          test -f docs/.vitepress/dist/reference/python/litepgo.html
          test -f docs/.vitepress/dist/reference/python/litepgo/torch.html
          uv run --locked --group docs --directory docs corepack pnpm exec node --test .vitepress/tutorials.test.mjs
          for notebook in tutorials/torch/[0-9][0-9]_*.ipynb; do
            lesson=$(basename "$notebook" .ipynb)
            test -f "docs/.vitepress/dist/tutorials/torch/$lesson.html"
            test -f "docs/.vitepress/dist/tutorial-notebooks/torch/$lesson.ipynb"
          done
          test -f docs/.vitepress/dist/tutorial-notebooks/torch/bunny-tet.veg
          test -f docs/.vitepress/dist/tutorial-notebooks/torch/bunny-hex.veg
      - name: Preserve executed notebooks on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-failure
          path: |
            build/torch-tutorials/
            build/energy-tutorials/
          if-no-files-found: ignore
      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
